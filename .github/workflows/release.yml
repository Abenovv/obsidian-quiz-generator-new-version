name: Check and publish plugin

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "vendor/**"
      - "styles/**"
      - "tests/**"
      - "scripts/**"
      - "package*.json"
      - "tsconfig*.json"
      - main.js
      - manifest.json
      - styles.css
      - versions.json
      - SHA256SUMS
      - RELEASE_NOTES.md
      - .github/workflows/release.yml
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-generator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build tools
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run regression tests
        run: npm test
      - name: Rebuild plugin
        run: npm run build
      - name: Check reproducible distribution
        run: git diff --exit-code -- main.js styles.css SHA256SUMS
      - name: Validate publishable files
        run: node scripts/verify-release.mjs

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish versioned plugin files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).version')"
          name="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8")).name')"
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version already exists; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$version" main.js manifest.json styles.css SHA256SUMS \
            --target "$RELEASE_COMMIT" \
            --title "$name $version" \
            --notes-file RELEASE_NOTES.md \
            --latest
